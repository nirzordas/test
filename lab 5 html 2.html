<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Admission Form</title>
</head>

<body>

  <h2>University Admission Form</h2>

  <form action="/register" method="POST">

    <!-- PERSONAL INFORMATION -->
    <fieldset>
      <legend><b>Personal Information</b></legend>

      <label for="fullname">Full Name:</label><br>
      <input type="text" id="fullname" name="fullname" required maxlength="40"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="password">Password:</label><br>
      <input type="password" id="password" name="password" required><br><br>

      <label for="confirm-password">Confirm Password:</label><br>
      <input type="password" id="confirm-password" name="confirm-password" required><br><br>

      <label>Gender:</label><br>
      <input type="radio" id="male" name="gender" value="Male" required> Male
      <input type="radio" id="female" name="gender" value="Female"> Female
      <input type="radio" id="other" name="gender" value="Other"> Other
      <br><br>

      <label for="dob">Date of Birth:</label><br>
      <input type="date" id="dob" name="dob" required><br><br>

      <label for="country">Country:</label><br>
      <select id="country" name="country" required>
        <option value="">--Select Country--</option>
        <option value="Bangladesh">Bangladesh</option>
        <option value="USA">USA</option>
        <option value="India">India</option>
        <option value="UK">UK</option>
      </select>
      <br><br>

      <label>Interests:</label><br>
      <input type="checkbox" name="interest" value="Sports"> Sports <br>
      <input type="checkbox" name="interest" value="Music"> Music <br>
      <input type="checkbox" name="interest" value="Technology"> Technology <br>
      <input type="checkbox" name="interest" value="Art"> Art <br><br>

    </fieldset>

    <br>

    <!-- ACADEMIC INFORMATION -->
    <fieldset>
      <legend><strong>Academic Information</strong></legend>

      <label for="qualification">Highest Qualification:</label><br>
      <input type="text" id="qualification" name="qualification" required maxlength="50"><br><br>

      <label for="result">GPA / Result:</label><br>
      <input type="text" id="result" name="result" maxlength="10"><br><br>

      <label for="department">Preferred Department:</label><br>
      <select id="department" name="department" required>
        <option value="">--Select Department--</option>
        <option value="CSE">Computer Science and Engineering</option>
        <option value="EEE">Electrical Engineering</option>
        <option value="BBA">Business Administration</option>
        <option value="Law">Law</option>
        <option value="English">English</option>
      </select>
      <br><br>

      <label for="transcript">Upload Transcript:</label><br>
      <input type="file" id="transcript" name="transcript" required><br><br>

      <label for="photo">Upload Photo:</label><br>
      <input type="file" id="photo" name="photo" required><br><br>
    </fieldset>

    <br>

    <!-- TERMS -->
    <label>
      <input type="checkbox" id="terms" name="terms" required>
      I agree to the terms and conditions.
    </label>
    <br><br>

    <!-- BUTTONS -->
    <button type="submit">Submit Application</button>
    <button type="reset">Reset Form</button>

  </form>

</body>
</html>
