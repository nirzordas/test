<!DOCTYPE html>
<html>
<head>
<title>Farmer Dashboard</title>
<style>
body { margin:0; font-family:Arial; background:#f9fff5; }

.header {
  background:#8bc34a;
  color:white;
  padding:15px 20px;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logout-btn {
  background:#ffeb3b;
  border:none;
  padding:8px 14px;
  font-weight:bold;
  border-radius:5px;
  cursor:pointer;
}

.container { display:flex; }

.sidebar {
  width:220px; background:#f1f8e9; min-height:100vh;
}

.sidebar a {
  display:block;
  padding:15px;
  text-decoration:none;
  font-weight:bold;
  color:#2e7d32;
  border-bottom:1px solid #dcedc8;
}

.sidebar a:hover { background:#dcedc8; }

.main { padding:30px; flex:1; }

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card {
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.card h3 { color:#558b2f; }

button {
  background:#ffeb3b;
  border:none;
  padding:10px 16px;
  font-weight:bold;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- Header with Logout -->
<div class="header">
  <span>Farmer Dashboard</span>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="sidebar">
    <a href="rent-tool-history.html">Rent Tool History</a>
    <a href="order-history.html">Order History</a>
    <a href="consultation-history.html">Consultation History</a>
  </div>

  <div class="main">
    <h2>Welcome, Farmer</h2>

    <div class="cards">
      <div class="card">
        <h3>Marketplace</h3>
        <button onclick="location.href='marketplace.html'">Go to Marketplace</button>
      </div>

      <div class="card">
        <h3>Upload Crops</h3>
        <button onclick="location.href='upload-crops.html'">Upload Crops</button>
      </div>

      <div class="card">
        <h3>View Orders</h3>
        <button onclick="location.href='view-orders.html'">View Orders</button>
      </div>

      <div class="card">
        <h3>Consultation</h3>
        <button onclick="location.href='consultation.html'">Consult Expert</button>
      </div>

      <div class="card">
        <h3>Rent Tools</h3>
        <button onclick="location.href='rent-tools.html'">Rent Tools</button>
      </div>
    </div>
  </div>

</div>

<script>
function logout() {
  // Optional confirmation
  if (confirm("Are you sure you want to logout?")) {
    window.location.href = "login.html"; // change to your login page
  }
}
</script>

</body>
</html>
