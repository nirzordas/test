<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Page</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header, footer {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 15px 0;
        }


        .profile-box {
            width: 350px; 
            margin: 30px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .profile-box img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            display: block;
            margin: 0 auto 15px;
        }

        .info {
            text-align: center;
        }

        .info h2 {
            margin: 10px 0;
            font-size: 1.6em;
        }

        .info p {
            margin: 5px 0;
            font-size: 1em;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Profile Page</h1>
    </header>

    <!-- Profile Section -->
    <section class="profile-box">
         <a href="https://github.com/"><img src="E:\bibeks birthday\IMG_9469.JPG" alt="Student Photo"></a>
        

        <div class="info">
            <h2>Your Name</h2>
            <p><strong>Department:</strong> Computer Science</p>
            <p><strong>Student ID:</strong> 23-52172-2</p>
            <p><strong>Short Bio:</strong> I am a student who loves web development and programming.</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2025 | AIUB | Student Profile Page</p>
    </footer>

</body>
</html>
